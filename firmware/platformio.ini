; AtomS3R + Unit RFID2 + Atomic QRCode2 Base。UID と QR を USB キーボードとして打ち込む
[env:atoms3r]
platform = espressif32@6.11.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
lib_deps =
	m5stack/M5Unified@0.2.26
	computer991/Arduino_MFRC522v2@2.0.1
