; AtomS3R + Unit RFID2 + Atomic QRCode2 Base
; atoms3r: UID と QR を USB キーボードとして打ち込む（モニターのある工程）
; atoms3r-wifi: Wi-Fi でサーバーへ送り、結果を本体の画面に出す（モニターの無い工程）
[env:atoms3r]
platform = espressif32@6.11.0
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
lib_deps =
	m5stack/M5Unified@0.2.26
	computer991/Arduino_MFRC522v2@2.0.1

[env:atoms3r-wifi]
extends = env:atoms3r
build_flags =
	${env:atoms3r.build_flags}
	-DKENSA_WIFI
lib_deps =
	${env:atoms3r.lib_deps}
	bblanchon/ArduinoJson@7.4.2
