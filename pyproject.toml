[project]
name = "kensa-tag"
version = "0.1.0"
description = "検査が終わった製品を電子タグで見えるようにする"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "anthropic>=0.75", "pydantic>=2.8"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
