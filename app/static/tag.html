<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カードの中身</title>
<style>
:root {
  --bg: #f4f5f2; --panel: #fff; --ink: #1d2320; --muted: #667069; --line: #d8dcd5;
  --accent: #116a57; --warn: #a96400; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151816; --panel: #1f2421; --ink: #eef1ec; --muted: #a2aba4; --line: #39413b;
    --accent: #58c4a8; --warn: #e7a94b; --bad: #f2867a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.big { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 0; }
.order { font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
.place { font-size: 22px; font-weight: 600; color: var(--accent); }
.note { color: var(--warn); font-weight: 600; }
.err { color: var(--bad); font-weight: 600; }
dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin: 0; }
dt { color: var(--muted); font-size: 14px; }
dd { margin: 0; }
h2 { font-size: 16px; margin: 0 0 8px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; }
th, td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
tr.me td { font-weight: 700; }
small { color: var(--muted); }
</style>
</head>
<body>
<main id="body"><p>読み込んでいます…</p></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(iso) {
  if (!iso) return "-";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function load() {
  const uid = decodeURIComponent(location.pathname.split("/").pop());
  const main = document.getElementById("body");
  const res = await fetch("/api/tags/" + encodeURIComponent(uid)).catch(() => null);
  if (!res || !res.ok) {
    const body = res ? await res.json().catch(() => ({})) : {};
    main.innerHTML = `<section><p class="err">${esc(body.detail || "サーバーにつながりません")}</p><small>カード ${esc(uid)}</small></section>`;
    return;
  }
  const t = await res.json();
  const o = await (await fetch("/api/orders/" + encodeURIComponent(t.order_no))).json().catch(() => null);
  const rows = (o?.bunnos || []).map(b => `<tr class="${b.bunno === t.bunno ? "me" : ""}"><td>${b.bunno ?? "未採番"}</td><td>${esc(b.place)}</td><td>${esc(fmt(b.last_read_at))}</td></tr>`).join("");
  main.innerHTML = `<section>
      <p class="big">${t.bunno ? "分納 " + t.bunno : "未採番"}</p>
      <p class="order">注文 ${esc(t.order_no)}</p>
      <p>いま <span class="place">${esc(t.place)}</span></p>
      ${t.in_use ? "" : '<p class="note">このカードは使い終わっています。最後の中身を出しています</p>'}
      <dl>
        <dt>品番</dt><dd>${esc(t.item_code || "-")}</dd>
        <dt>得意先</dt><dd>${esc(t.customer || "-")}</dd>
        <dt>納期</dt><dd>${esc(t.due_date || "-")}</dd>
        <dt>数量</dt><dd>${t.produced ?? "未定"}</dd>
        <dt>最後に読んだ</dt><dd>${esc(fmt(t.last_read_at))}</dd>
      </dl>
    </section>
    ${rows ? `<section><h2>同じ注文の分納</h2><table><thead><tr><th>分納</th><th>いまどこ</th><th>最後に読んだ</th></tr></thead><tbody>${rows}</tbody></table></section>` : ""}
    <small>カード ${esc(t.uid)}</small>`;
}
load();
</script>
</body>
</html>
