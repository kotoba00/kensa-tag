<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>検査のお仕事</title>
<style>
:root {
  --bg: #f4f5f2; --panel: #fff; --ink: #1d2320; --muted: #667069; --line: #d8dcd5;
  --accent: #116a57; --accent-ink: #fff; --bad: #b42318; --late: #c27a00;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151816; --panel: #1f2421; --ink: #eef1ec; --muted: #a2aba4; --line: #39413b;
    --accent: #58c4a8; --accent-ink: #10201b; --bad: #f2867a; --late: #e7a94b; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.6 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.lead { color: var(--muted); font-size: 15px; margin: 0 0 16px; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 22px 0 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.card.done { border: 2px solid var(--accent); }
.card.back { opacity: .7; }
.card b { font-size: 21px; display: block; }
.meta { color: var(--muted); font-size: 16px; }
.due { font-weight: 700; }
.due.late { color: var(--late); }
.steps { display: flex; gap: 6px; margin-top: 12px; }
.steps button { flex: 1; min-height: 56px; font: inherit; font-size: 17px; font-weight: 700; border-radius: 10px;
  border: 2px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.steps button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.state { margin-top: 10px; font-weight: 700; color: var(--accent); }
.empty { color: var(--muted); }
#msg { min-height: 1.6em; font-weight: 600; color: var(--accent); }
#msg.err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1 id="title">検査のお仕事</h1>
  <p class="lead">進んだら、いまの進捗を押してください。検査済にすると引き取りに伺います。</p>
  <p id="msg" role="status"></p>
  <div id="list" aria-live="polite"><p class="empty">読み込んでいます…</p></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = location.pathname.split("/").pop();
let busy = false, steps = [];

function md(iso) {
  if (!iso) return "-";
  const d = new Date(iso.length === 10 ? iso + "T00:00:00" : iso);
  return `${d.getMonth()+1}月${d.getDate()}日`;
}
function hm(iso) {
  const d = new Date(iso);
  return `${md(iso)} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function late(due) {
  if (!due) return false;
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return new Date(due + "T00:00:00") < t;
}
function say(text, bad = false) { $("msg").textContent = text; $("msg").className = bad ? "err" : ""; }

function card(i) {
  const head = `<b>注文 ${esc(i.order_no)} ／ 分納 ${i.bunno}</b>
    <div class="meta">${esc(i.item_code || "")}　${i.qty != null ? `${i.qty.toLocaleString()} 個` : "数量は袋の札を見てください"}</div>`;
  if (i.returned_at) {
    return `<div class="card back">${head}<div class="state">${md(i.returned_at)}に受け取りました。ありがとうございました</div></div>`;
  }
  const finished = i.progress === steps[steps.length - 1];
  const due = `<div class="meta">お届けの目安 <span class="due ${late(i.due_date) && !finished ? "late" : ""}">${md(i.due_date)}</span></div>`;
  // 内職さんが変えられるのは進捗だけ
  const pick = steps.map(p => `<button type="button" aria-pressed="${p === i.progress}"
      data-no="${esc(i.order_no)}" data-bunno="${i.bunno}" data-p="${esc(p)}">${esc(p)}</button>`).join("");
  return `<div class="card ${finished ? "done" : ""}">${head}${due}
    <div class="steps" role="group" aria-label="進捗">${pick}</div>
    ${finished ? `<div class="state">✓ ${i.progress_at ? hm(i.progress_at) + " に" : ""}検査済。引き取りに伺います</div>` : ""}</div>`;
}

function draw(data) {
  steps = data.progress;
  $("title").textContent = `${data.worker}さんのお仕事`;
  document.title = `${data.worker}さんのお仕事`;
  const now = data.items.filter(i => !i.returned_at);
  const back = data.items.filter(i => i.returned_at);
  $("list").innerHTML =
    (now.length ? now.map(card).join("") : '<p class="empty">いまお預けしているものはありません。</p>') +
    (back.length ? `<h2>受け取ったもの（この1週間）</h2>${back.map(card).join("")}` : "");
  $("list").querySelectorAll(".steps button").forEach(b => b.addEventListener("click", () => {
    if (b.getAttribute("aria-pressed") === "true") return;
    send(b.dataset.no, Number(b.dataset.bunno), b.dataset.p);
  }));
}

async function send(order_no, bunno, progress) {
  busy = true;
  const res = await fetch(`/api/w/${key}/progress`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_no, bunno, progress }),
  }).catch(() => null);
  busy = false;
  if (!res || !res.ok) {
    const body = res ? await res.json().catch(() => ({})) : {};
    say(body.detail || "送れませんでした。もう一度押してください", true);
    return;
  }
  say(`注文${order_no} 分納${bunno} を「${progress}」にしました`);
  draw(await res.json());
}

async function refresh() {
  if (busy) return;
  const res = await fetch(`/api/w/${key}`).catch(() => null);
  if (!res) { say("つながりません。電波のよい所でもう一度開いてください", true); return; }
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    $("list").innerHTML = "";
    say(body.detail || "このページは使えません", true);
    return;
  }
  if ($("msg").className === "err") say("");
  draw(await res.json());
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
