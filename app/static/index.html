<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>検査場タグ</title>
<style>
:root {
  --bg: #f4f5f2; --panel: #fff; --ink: #1d2320; --muted: #667069; --line: #d8dcd5;
  --accent: #116a57; --ok: #116a57; --warn: #a96400; --bad: #b42318; --hi: #fff7e6;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151816; --panel: #1f2421; --ink: #eef1ec; --muted: #a2aba4; --line: #39413b;
    --accent: #58c4a8; --ok: #58c4a8; --warn: #e7a94b; --bad: #f2867a; --hi: #33290f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
header { padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
h1 { font-size: 20px; margin: 0; }
header small { color: var(--muted); }
main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
  grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
section.full { grid-column: 1 / -1; }
h2 { font-size: 16px; margin: 0 0 10px; }
#stations { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
#stations .pick[data-station=lookup] { margin-left: auto; }
.pick { font: inherit; font-size: 15px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; }
.pick[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--panel); font-weight: 600; }
#lookup { display: flex; gap: 6px; margin-bottom: 10px; }
#lookup input { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); width: 11em; }
#scan { width: 100%; font: 600 22px ui-monospace, Menlo, monospace; padding: 10px 12px;
  border: 2px solid var(--accent); border-radius: 6px; background: var(--bg); color: var(--ink); }
#scan::placeholder { font: 400 15px "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
#result { margin-top: 12px; padding: 16px; border-radius: 6px; background: var(--bg); min-height: 96px; border-left: 6px solid var(--line); }
#result b { display: block; font-size: 26px; line-height: 1.3; }
#result b.big { font-size: 64px; line-height: 1.1; }
#result[data-tone=ok] { border-color: var(--ok); }
#result[data-tone=wait] { border-color: var(--accent); }
#result[data-tone=warn] { border-color: var(--warn); }
#result[data-tone=bad] { border-color: var(--bad); }
#queue { color: var(--warn); font-size: 14px; margin-top: 8px; min-height: 22px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; }
th, td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num { font-variant-numeric: tabular-nums; }
button.link { all: unset; color: var(--accent); cursor: pointer; text-decoration: underline; font-variant-numeric: tabular-nums; }
button.link:focus-visible { outline: 2px solid var(--accent); }
.due-soon { color: var(--bad); font-weight: 600; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
.bar h2 { margin: 0; }
button.main { font: inherit; font-weight: 600; padding: 8px 14px; border-radius: 6px; border: 0; background: var(--accent); color: var(--panel); cursor: pointer; }
button.main:disabled { opacity: .55; cursor: wait; }
#summary { padding: 12px 14px; background: var(--hi); border-radius: 6px; margin-bottom: 12px; font-weight: 500; }
#summary:empty { display: none; }
.card { border-top: 1px solid var(--line); padding: 12px 0; }
.card h3 { font-size: 16px; margin: 0 0 4px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 4px; background: var(--bg); border: 1px solid var(--line); margin-right: 6px; }
.tag.p0 { color: var(--bad); border-color: var(--bad); }
.tag.p1 { color: var(--warn); border-color: var(--warn); }
.ai { margin: 8px 0 0; padding-left: 12px; border-left: 3px solid var(--accent); }
.ai dt { font-size: 12px; color: var(--muted); }
.ai dd { margin: 0 0 6px; }
.empty { color: var(--muted); }
#err { color: var(--bad); margin-bottom: 8px; }
#err:empty { display: none; }
#tstatus { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
#tstatus:empty { display: none; }
dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: min(720px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.4); }
@media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>検査場タグ</h1>
  <small>カードをかざすだけで、製品がいまどの工程にあるかを見えるようにする</small>
  <a href="/board" style="margin-left:auto;color:var(--accent)">工場の図で見る</a>
</header>
<main>
  <section>
    <h2>この端末の工程</h2>
    <div id="stations" role="group" aria-label="工程"></div>
    <input id="scan" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="読み取り入力" placeholder="QR またはカード">
    <div id="result" data-tone="" aria-live="polite"></div>
    <div id="queue"></div>
  </section>
  <section>
    <h2>いま<span id="cpName">社内検査</span>にあるもの <span id="count"></span></h2>
    <form id="lookup"><input id="lookupNo" inputmode="numeric" autocomplete="off" aria-label="注文番号" placeholder="注文番号"><button class="pick">分納の場所を見る</button></form>
    <div class="table-wrap"><table>
      <thead><tr><th>注文番号</th><th>分納</th><th>品番</th><th>数量</th><th>入った日</th><th>経過</th><th>納期まで</th></tr></thead>
      <tbody id="list"></tbody>
    </table></div>
  </section>
  <section class="full">
    <div class="bar">
      <h2>確認が要るもの <span id="acount"></span></h2>
      <button class="main" id="triage">Claude に見てもらう</button>
    </div>
    <div id="err"></div>
    <div id="tstatus" aria-live="polite"></div>
    <div id="summary"></div>
    <div id="anoms"></div>
  </section>
</main>
<dialog id="dlg"><div id="dlgBody"></div><form method="dialog"><button class="main">閉じる</button></form></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const QKEY = "kensa-queue";

function deviceId() {
  try {
    let id = localStorage.getItem("kensa-device");
    if (!id) { id = "kensa-" + crypto.randomUUID().slice(0, 8); localStorage.setItem("kensa-device", id); }
    return id;
  } catch { return "kensa-unsaved"; }
}
let memQueue = [];
function loadQueue() { try { return JSON.parse(localStorage.getItem(QKEY) || "[]"); } catch { return memQueue; } }
function saveQueue(q) { memQueue = q; try { localStorage.setItem(QKEY, JSON.stringify(q)); } catch {} }

const TONES = { recorded:"ok", bound:"ok", assigned:"ok", order_set:"wait", already_recorded:"warn", already_bound:"warn", in_use:"warn", already_assigned:"ok", debounced:"warn", unbound:"bad", unknown:"bad", no_order:"bad", wrong_process:"bad", unknown_process:"bad" };
function show(r) {
  const el = $("result");
  el.dataset.tone = TONES[r.outcome] || "";
  const who = r.order_no ? `注文 ${esc(r.order_no)}${r.bunno ? " / 分納 " + r.bunno : ""}` : "";
  // エレベーターでは、番号を離れた場所からでも読めるように大きく出す
  const big = r.outcome === "assigned" || r.outcome === "already_assigned";
  el.innerHTML = big ? `<b class="big">分納 ${r.bunno}</b><span>注文 ${esc(r.order_no)}</span>` : `<b>${esc(r.message)}</b><span>${who}</span>`;
}

let sending = false;
async function flush() {
  if (sending) return;
  sending = true;
  let q = loadQueue();
  try {
    // 順番を変えない。QR とカードの組が崩れるため
    while (q.length) {
      const res = await fetch("/api/scan", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(q[0]) });
      if (!res.ok) throw new Error(res.status);
      const r = await res.json();
      if (!r.replayed) show(r);
      q = q.slice(1);
      saveQueue(q);
    }
    $("queue").textContent = "";
    refresh();
  } catch {
    $("queue").textContent = `送れていない読み取りが ${q.length} 件あります。自動で送り直します`;
  } finally { sending = false; }
}

function enqueue(raw) {
  const q = loadQueue();
  // 工程は読んだ時点のものを持たせる。送り直しの間に切り替えても変わらない
  q.push({ event_id: crypto.randomUUID(), raw, device_id: deviceId(), read_at: new Date().toISOString(), process: station.code, phase });
  saveQueue(q);
  flush();
}

const input = $("scan");
let composing = false;
input.addEventListener("compositionstart", () => { composing = true; });
input.addEventListener("compositionend", () => { composing = false; });
input.addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  e.preventDefault();
  const v = input.value.trim();
  const wasComposing = composing || e.isComposing;
  input.value = "";
  if (wasComposing) {
    $("result").dataset.tone = "bad";
    $("result").innerHTML = "<b>日本語入力をオフにしてください</b><span>もう一度かざしてください</span>";
    return;
  }
  if (!v) return;
  if (station.action === "lookup") lookup(v); else enqueue(v);
});
// 読み取り機の文字がよそへ入らないよう、ダイアログ以外では入力欄に戻す
document.addEventListener("click", e => {
  if (!$("dlg").open && !e.target.closest("button, a, #lookup")) input.focus();
});
window.addEventListener("focus", () => { if (!$("dlg").open) input.focus(); });
$("dlg").addEventListener("close", () => input.focus());

function bunnoLabel(b) { return b.bunno ?? "未採番"; }
function qtyLabel(q) { return q ?? "未定"; }

const HINT = {
  bind: "記録票の QR を読んで、カードをかざす",
  assign: "カードをかざすと、分納番号を出す",
  record: "カードをかざす",
  lookup: "記録票の QR を読むと、分納ごとの場所を出す。記録はしない",
};
// 工程ではないので flow.json には置かない
const LOOKUP = { code: "lookup", name: "調べる", action: "lookup", phases: ["point"] };
function stations() { return [...flow.processes, LOOKUP]; }

async function lookup(v) {
  const el = $("result");
  if (/^\d{5,7}$/.test(v)) { openOrder(v); return; }
  const res = await fetch("/api/tags/" + encodeURIComponent(v)).catch(() => null);
  if (!res || !res.ok) {
    const body = res ? await res.json().catch(() => ({})) : {};
    el.dataset.tone = "bad";
    el.innerHTML = `<b>${esc(body.detail || "調べられませんでした")}</b><span>${esc(v)}</span>`;
    return;
  }
  const t = await res.json();
  el.dataset.tone = t.in_use ? "ok" : "warn";
  el.innerHTML = `<b class="big">${t.bunno ? "分納 " + t.bunno : "未採番"}</b>
    <span>注文 ${orderLink(t.order_no)} ／ ${esc(t.item_code || "")} ／ 納期 ${esc(t.due_date || "-")}</span><br>
    <span>いま <strong>${esc(t.place)}</strong>（${esc(fmt(t.last_read_at))}）${t.in_use ? "" : " ／ このカードは使い終わっています"}</span>`;
}
// 開始か終了かはサーバーが読んだ順で決める
let flow = null, station = null;
const phase = "point";
function storedStation() { try { return localStorage.getItem("kensa-station"); } catch { return null; } }
function renderStation() {
  $("stations").innerHTML = stations().map(p => `<button class="pick" data-station="${esc(p.code)}" aria-pressed="${p === station}">${esc(p.name)}</button>`).join("");
  $("scan").placeholder = HINT[station.action];
  $("result").dataset.tone = "";
  $("result").innerHTML = `<b>${esc(station.name)}</b><span>${esc(HINT[station.action])}</span>`;
}
function pickStation(p) {
  station = p;
  try { localStorage.setItem("kensa-station", p.code); } catch {}
  renderStation();
}
document.addEventListener("click", e => {
  const s = e.target.closest("[data-station]");
  if (s) { pickStation(stations().find(p => p.code === s.dataset.station)); input.focus(); }
});
$("lookup").addEventListener("submit", e => {
  e.preventDefault();
  const no = $("lookupNo").value.trim();
  $("lookupNo").value = "";
  if (no) openOrder(no); else input.focus();
});
function orderLink(no) { return `<button class="link" data-order="${esc(no)}">${esc(no)}</button>`; }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-order]");
  if (b) openOrder(b.dataset.order);
});

async function openOrder(no) {
  const res = await fetch("/api/orders/" + encodeURIComponent(no));
  if (!res.ok) {
    $("result").dataset.tone = "bad";
    $("result").innerHTML = `<b>注文 ${esc(no)} は見つかりません</b>`;
    input.focus();
    return;
  }
  const o = await res.json();
  const rows = o.bunnos.map(b => `<tr><td class="num">${bunnoLabel(b)}</td><td>${esc(b.place)}</td>
    <td>${esc(fmt(b.last_read_at))}</td><td class="num">${qtyLabel(b.produced)}</td><td>${esc(b.shipped_on || "")}</td><td class="num">${b.qty || ""}</td></tr>`).join("");
  $("dlgBody").innerHTML = `<h2>注文 ${esc(o.order_no)}</h2>
    <p>${esc(o.item_code || "")} ／ ${esc(o.customer || "")} ／ 注文数 ${o.qty ?? "-"} ／ 納期 ${esc(o.due_date || "-")}${o.done ? " ／ 完納" : ""}</p>
    <div class="table-wrap"><table><thead><tr><th>分納</th><th>いまどこ</th><th>最後に読んだ</th><th>数量</th><th>出荷日</th><th>出荷数</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="6" class="empty">記録がありません</td></tr>'}</tbody></table></div>`;
  $("dlg").showModal();
}

function fmt(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

async function refreshList() {
  const rows = await (await fetch("/api/inspection")).json();
  $("count").textContent = `${rows.length} 件`;
  $("list").innerHTML = rows.map(r => `<tr><td>${orderLink(r.order_no)}</td><td class="num">${bunnoLabel(r)}</td><td>${esc(r.item_code || "")}</td><td class="num">${qtyLabel(r.qty)}</td>
    <td>${esc(fmt(r.arrived_at))}</td><td class="num">${r.days} 日</td>
    <td class="num ${r.days_to_due !== null && r.days_to_due <= 3 ? "due-soon" : ""}">${r.days_to_due === null ? "-" : r.days_to_due + " 日"}</td></tr>`).join("")
    || '<tr><td colspan="7" class="empty">いまはありません</td></tr>';
}

const KIND = { forgotten:"かざし忘れ", stagnant:"滞留", qty_mismatch:"数量の照合", bunno_total:"分納の合計" };
const ORDER = { "今日中":0, "今週中":1, "様子見":2 };
let anomTimer;
function renderAnoms(data) {
  const items = data.items;
  $("acount").textContent = `${items.length} 件`;
  const t = data.triage;
  $("summary").textContent = t ? t.summary : "";
  $("tstatus").textContent = data.thinking ? "新しい読み取りを受けて、Claude が見立てを作り直しています…"
    : data.auto_error ? `見立てを作り直せませんでした。${data.auto_error}`
    : data.triage_stale ? `この見立ては ${fmt(t.created_at)} の検出結果のものです`
    : t ? `見立て ${fmt(t.created_at)}` : "";
  // 作り直している間は早めに見に行き、できたらすぐ出す
  clearTimeout(anomTimer);
  if (data.thinking) anomTimer = setTimeout(() => refreshAnoms().catch(() => {}), 5000);
  const byId = Object.fromEntries((t?.items || []).map(i => [i.anomaly_id, i]));
  const sorted = [...items].sort((a, b) => (ORDER[byId[a.id]?.priority] ?? 3) - (ORDER[byId[b.id]?.priority] ?? 3));
  $("anoms").innerHTML = sorted.map(a => {
    const ai = byId[a.id];
    const p = ai ? `<span class="tag p${ORDER[ai.priority]}">${esc(ai.priority)}</span>` : "";
    const g = ai?.group ? `<span class="tag">${esc(ai.group)}</span>` : "";
    return `<div class="card"><h3>${p}<span class="tag">${KIND[a.kind] || esc(a.kind)}</span>${g}</h3>
      <div>${esc(a.title)} ${orderLink(a.order_no)}</div>
      ${ai ? `<dl class="ai"><dt>考えられる原因</dt><dd>${esc(ai.likely_cause)}</dd><dt>次の一手（${esc(ai.ask_role)}）</dt><dd>${esc(ai.next_action)}</dd></dl>` : ""}</div>`;
  }).join("") || '<p class="empty">確認が要るものはありません</p>';
}
async function refreshAnoms() { renderAnoms(await (await fetch("/api/anomalies")).json()); }
async function refresh() { try { await Promise.all([refreshList(), refreshAnoms()]); } catch {} }

$("triage").addEventListener("click", async () => {
  const b = $("triage");
  b.disabled = true; b.textContent = "考えています…"; $("err").textContent = "";
  try {
    const res = await fetch("/api/triage", { method:"POST" });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Claude に聞けませんでした（${res.status}）`);
    }
    await refreshAnoms();
  } catch (e) { $("err").textContent = e.message; }
  finally { b.disabled = false; b.textContent = "Claude に見てもらう"; input.focus(); }
});

async function start() {
  flow = await (await fetch("/api/flow")).json();
  $("cpName").textContent = flow.checkpoint_name;
  pickStation(stations().find(p => p.code === storedStation()) || flow.processes[0]);
  setInterval(flush, 5000);
  setInterval(refresh, 30000);
  input.focus();
  refresh();
  flush();
}
start();
</script>
</body>
</html>
