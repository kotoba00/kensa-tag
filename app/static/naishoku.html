<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>内職さんに渡す</title>
<style>
:root {
  --bg: #f4f5f2; --panel: #fff; --ink: #1d2320; --muted: #667069; --line: #d8dcd5;
  --accent: #116a57; --accent-ink: #fff; --bad: #b42318;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151816; --panel: #1f2421; --ink: #eef1ec; --muted: #a2aba4; --line: #39413b;
    --accent: #58c4a8; --accent-ink: #10201b; --bad: #f2867a; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 17px/1.55 "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 18px 0 8px; }
.groups { display: flex; gap: 8px; flex-wrap: wrap; }
.groups button { flex: 1 1 30%; min-height: 52px; font: inherit; font-weight: 700; border-radius: 10px;
  border: 2px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
.groups button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.card b { font-size: 20px; }
.card small { color: var(--muted); display: block; }
.card[aria-pressed="true"] { border: 2px solid var(--accent); }
form { background: var(--panel); border: 2px solid var(--accent); border-radius: 10px; padding: 14px; margin-top: 4px; }
label { display: block; margin: 0 0 10px; font-size: 15px; color: var(--muted); }
input { display: block; width: 100%; font: inherit; padding: 8px 10px; margin-top: 4px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.save { width: 100%; min-height: 52px; font: inherit; font-weight: 700; border: 0; border-radius: 10px;
  background: var(--accent); color: var(--accent-ink); cursor: pointer; }
.empty { color: var(--muted); }
#msg { min-height: 1.5em; font-weight: 600; color: var(--accent); }
#msg.err { color: var(--bad); }
footer { margin-top: 24px; font-size: 14px; }
footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>内職さんに渡す</h1>
  <h2>1. 内職さんを選ぶ</h2>
  <div class="groups" id="groups"></div>
  <h2>2. さっきかざした分納を選ぶ</h2>
  <div id="list" aria-live="polite"><p class="empty">読み込んでいます…</p></div>
  <p id="msg" role="status"></p>
  <footer>社外検査の読み取り機でカゴのカードをかざすと、ここに出ます。<a href="/board">工場図へ</a>
    <h2>内職さんに渡す専用ページ</h2>
    <p id="links" class="empty"></p>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = p => `${p.order_no}-${p.bunno}`;
let worker = null, picked = null, pending = [], drafting = false, loaded = false;

function fmt(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function inDays(n) {
  const d = new Date(); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function say(text, bad = false) { $("msg").textContent = text; $("msg").className = bad ? "err" : ""; }

function drawGroups(workers) {
  $("groups").innerHTML = workers.map(w => `<button type="button" aria-pressed="${w === worker}">${esc(w)}</button>`).join("");
  $("groups").querySelectorAll("button").forEach((b, n) => b.addEventListener("click", () => {
    worker = workers[n];
    try { localStorage.setItem("naishoku-worker", worker); } catch {}
    drawGroups(workers); drawList();
  }));
}

function drawList() {
  if (!pending.length) { $("list").innerHTML = '<p class="empty">依頼を待っている分納はありません。</p>'; return; }
  $("list").innerHTML = pending.map(p => `
    <button type="button" class="card" data-key="${esc(key(p))}" aria-pressed="${picked === key(p)}">
      <b>注文 ${esc(p.order_no)} ／ 分納 ${p.bunno}</b>
      <small>${esc(p.item_code || "")}　数量 ${p.qty ?? "未定"}　${fmt(p.handed_at)} にかざした</small>
    </button>
    ${picked === key(p) ? form(p) : ""}`).join("");
  $("list").querySelectorAll(".card").forEach(b => b.addEventListener("click", () => {
    picked = picked === b.dataset.key ? null : b.dataset.key;
    drafting = false;
    drawList();
  }));
  const f = $("list").querySelector("form");
  if (f) {
    f.addEventListener("input", () => { drafting = true; });
    f.addEventListener("submit", e => { e.preventDefault(); save(f); });
  }
}

function form(p) {
  if (!worker) return '<form><p class="empty">先に内職さんを選んでください。</p></form>';
  return `<form>
    <label>数量<input name="qty" type="number" inputmode="numeric" min="0" value="${p.qty ?? ""}" placeholder="未定なら空のまま"></label>
    <label>${esc(worker)}さんへの納期<input name="due" type="date" value="${inDays(7)}" required></label>
    <button class="save">${esc(worker)}さんに依頼する</button>
  </form>`;
}

async function save(f) {
  const p = pending.find(x => key(x) === picked);
  const qty = f.qty.value === "" ? null : Number(f.qty.value);
  const res = await fetch("/api/naishoku", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ order_no: p.order_no, bunno: p.bunno, worker, due_date: f.due.value, qty }),
  }).catch(() => null);
  if (!res || !res.ok) {
    const body = res ? await res.json().catch(() => ({})) : {};
    say(body.detail || "保存できませんでした。もう一度押してください", true);
    return;
  }
  say(`${worker}さんに 注文${p.order_no} 分納${p.bunno} を依頼しました`);
  picked = null; drafting = false;
  refresh();
}

async function refresh() {
  // 入力の途中は書き換えない
  if (drafting) return;
  const res = await fetch("/api/naishoku").catch(() => null);
  if (!res || !res.ok) { say("サーバーにつながりません。自動で読み直します", true); return; }
  const data = await res.json();
  if (!worker) {
    try { worker = localStorage.getItem("naishoku-worker"); } catch {}
    if (!data.workers.includes(worker)) worker = null;
    drawGroups(data.workers);
    // 内職さん本人が進捗を選ぶページ。URL がログインの代わりなので社外には貼らない
    $("links").innerHTML = data.workers.map(w => `<a href="${esc(data.links[w])}">${esc(w)}さん</a>`).join("　");
  }
  const before = pending.map(key).join();
  pending = data.pending;
  if (picked && !pending.some(p => key(p) === picked)) picked = null;
  if (!loaded || pending.map(key).join() !== before) drawList();
  loaded = true;
  if ($("msg").className === "err") say("");
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
